<VirtualHost *:80>
    ServerName 192.168.1.53

    # 孩子端 H5 静态资源（/ → h5）
    DocumentRoot /var/www/html/xxs/h5
    <Directory /var/www/html/xxs/h5>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # 管理后台 Admin 静态资源（/admin/ → admin）
    Alias /admin /var/www/html/xxs/admin
    <Directory /var/www/html/xxs/admin>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # 反向代理 /api → Spring Boot 8080
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:8080/api
    ProxyPassReverse /api http://127.0.0.1:8080/api

    # 启用 Apache 代理模块（如未启用需 a2enmod）
    <IfModule mod_headers.c>
        RequestHeader set X-Forwarded-Proto "http"
    </IfModule>
</VirtualHost>
